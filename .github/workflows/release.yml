name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version with three numeric components, such as 1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build signed release files
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v5
      - name: Read and validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            if [[ "$RELEASE_TAG" != v* ]]; then
              echo 'Release tags must use vMAJOR.MINOR.PATCH.' >&2
              exit 1
            fi
            version="${RELEASE_TAG#v}"
          else
            version="$REQUESTED_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Version must contain three numeric components, such as 1.0.0.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run CLI tests
        run: swift test --force-resolved-versions
      - name: Run release tooling tests
        run: scripts/test_distribution.sh
      - name: Prepare signing and notarization credentials
        env:
          CERTIFICATE: ${{ secrets.APPDAB_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPDAB_DEVELOPER_ID_P12_PASSWORD }}
          PROFILE: ${{ secrets.APPDAB_CLI_DEVELOPER_ID_PROFILE_BASE64 }}
          NOTARY_KEY: ${{ secrets.APPDAB_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPDAB_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPDAB_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for variable in CERTIFICATE CERTIFICATE_PASSWORD PROFILE NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing signing configuration: $variable" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/cli.provisionprofile"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          signing_password="$(openssl rand -hex 32)"
          echo "::add-mask::$signing_password"
          security create-keychain -p "$signing_password" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$signing_password" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$RUNNER_TEMP/signing.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_password" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials appdab-release --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$RUNNER_TEMP/signing.keychain-db"
      - name: Build, sign, and notarize the CLI
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_IDENTITY: ${{ secrets.APPDAB_DEVELOPER_ID_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_IDENTITY"
          scripts/package_cli.sh --version "$VERSION" --identity "$SIGNING_IDENTITY" \
            --profile "$RUNNER_TEMP/cli.provisionprofile" --output "$RUNNER_TEMP/release" \
            --notary-profile appdab-release --notary-keychain "$RUNNER_TEMP/signing.keychain-db"
      - name: Generate Homebrew cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/generate_homebrew_cask.sh --version "$VERSION" \
            --archive "$RUNNER_TEMP/release/AppDabCLI-$VERSION.zip" \
            --output "$RUNNER_TEMP/release/appdab-cli.rb"
      - name: Save release files as workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: AppDabCLI-release-candidate
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256
            ${{ runner.temp }}/release/*.rb
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/cli.provisionprofile" "$RUNNER_TEMP/notary.p8"

  publish:
    name: Attach files to GitHub release
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files from build
        uses: actions/download-artifact@v7
        with:
          name: AppDabCLI-release-candidate
          path: release
      - name: Attach ZIP and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "release/AppDabCLI-$VERSION.zip" \
            "release/AppDabCLI-$VERSION.zip.sha256"

  homebrew:
    name: Open Homebrew tap pull request
    if: github.event_name == 'release'
    needs: [package, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download release files from build
        uses: actions/download-artifact@v7
        with:
          name: AppDabCLI-release-candidate
          path: release
      - name: Check out Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: AppDab/homebrew-tap
          ref: main
          token: ${{ secrets.APPDAB_HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Propose the cask update
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.APPDAB_HOMEBREW_TAP_TOKEN }}
          GH_REPO: AppDab/homebrew-tap
          VERSION: ${{ needs.package.outputs.version }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          cask=Casks/appdab-cli.rb
          generated_cask=../release/appdab-cli.rb
          branch="appdab-cli/v$VERSION"

          if cmp -s "$generated_cask" "$cask"; then
            echo 'The tap already has this cask.'
            exit 0
          fi
          if [[ -f "$cask" ]]; then
            current_version="$(sed -nE 's/^[[:space:]]*version "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' "$cask")"
            if [[ -n "$current_version" && "$(printf '%s\n' "$VERSION" "$current_version" | sort -V | tail -n 1)" != "$VERSION" ]]; then
              echo "The tap already has a newer version ($current_version)."
              exit 0
            fi
          fi

          remote_branch="$(git ls-remote origin "refs/heads/$branch")"
          if [[ -n "$remote_branch" ]]; then
            git fetch origin "refs/heads/$branch"
            git switch -c "$branch" FETCH_HEAD
          else
            git switch -c "$branch"
          fi

          mkdir -p Casks
          cp "$generated_cask" "$cask"
          git add -- "$cask"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update AppDab CLI to $VERSION"
            git push origin "HEAD:refs/heads/$branch"
          fi

          pull_request="$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "$pull_request" ]]; then
            echo "$pull_request"
          else
            gh pr create --base main --head "$branch" \
              --title "Update AppDab CLI to $VERSION" \
              --body "Update the cask to use the signed ZIP from $RELEASE_URL."
          fi
