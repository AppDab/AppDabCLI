name: Swift

on:
  pull_request:

jobs:
  distribution:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test_distribution.sh

  format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftformat
      - run: swiftformat Sources Tests scripts Package.swift --lint --reporter github-actions-log --cache ignore
